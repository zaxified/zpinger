<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zpinger</title>
  <link id="favicon" rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- The bar floats over the list; folded, it is one line (the health
       pills and what the filters leave), unfolded it has the filters. The
       line along its bottom edge is the cycle being probed. -->
  <header id="bar" class="bar">
    <div class="bar-row">
      <div class="brand">
        <span id="logo" class="logo" role="img" aria-label="Probing">
          <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="15"/><circle id="ring" class="ring" cx="18" cy="18" r="15" pathLength="100"/></svg>
          <span class="dot"></span>
        </span>
        <h1>zpinger</h1>
        <span id="mode" class="tag" hidden>read-only demo</span>
      </div>
      <div id="health" class="summary health-row" role="group" aria-label="Filter by health"></div>
      <span id="shown-mini" class="note"></span>
      <span class="bar-buttons">
        <button id="events" class="bar-btn" type="button" aria-expanded="false" title="Problems of the last 24 hours, all targets">Events</button>
        <button id="add-open" class="bar-btn" type="button" title="Add a target">+</button>
        <button id="menu" class="bar-btn" type="button" aria-expanded="false" aria-controls="menu-body" title="Filters, order, and adding a target">☰</button>
      </span>
    </div>
    <div id="menu-body" class="bar-body" hidden>
      <div id="summary" class="summary" role="group" aria-label="Filter by status"></div>
      <div class="toolbar">
        <input id="find" type="search" placeholder="Find a name, host or tag" aria-label="Find a target" maxlength="100">
        <span class="order">
          <select id="sort" aria-label="Order of the list" title="Order of the list"></select>
          <button id="order" type="button"></button>
        </span>
        <button id="compact" class="bar-btn" type="button" aria-pressed="false" title="One line per target: more of them on a screen">Compact</button>
        <div id="tagbar" class="tagbar" role="group" aria-label="Filter by tag" hidden></div>
        <span id="shown" class="note"></span>
      </div>
      <div class="add-title">Add a target</div>
      <form id="add" class="add">
        <input name="name" title="Shown in the list" placeholder="Name" maxlength="64" required>
        <input name="host" title="IPv4 or IPv6 address, or a DNS name (resolved every cycle)" placeholder="IP address or host name" maxlength="253" required>
        <div id="add-tags" class="add-tags" data-target="new" title="Optional labels to filter the list by (at most 8); an IP address ticks ipv4 or ipv6">
          <span class="line tagline"><span class="tags"></span><button class="edit-btn edit-tags" type="button" data-focus="edit-tags" aria-label="Tags of the new target"></button></span>
        </div>
        <button type="submit" title="Start probing this host, five times a minute">Add target</button>
        <span id="add-error" class="error" role="alert"></span>
      </form>
    </div>
    <div id="line" class="cycle-line" title="This cycle's probes as they come: green answered, red lost"></div>
  </header>

  <main>
    <section id="feed" class="feed" aria-label="Events of the last 24 hours" hidden></section>

    <section id="targets" class="targets" aria-live="polite">
      <p class="empty">Loading…</p>
    </section>
    <div id="more" class="more" hidden></div>

  </main>

  <footer>
    <span id="updated"></span>
    · <a href="https://github.com/zaxified/zpinger">zpinger</a>, built with <a href="https://github.com/zaxified/zig-libs">zig-libs</a>
  </footer>

  <template id="row">
    <article class="target">
      <div class="head">
        <button class="expand" type="button" aria-expanded="false" title="Show or hide the 24-hour chart and the actions"></button>
        <span class="badge"></span>
        <span class="who">
          <span class="line"><span class="name"></span><button class="edit-btn edit-target" type="button" data-focus="edit-target" title="Rename, or change the host" aria-label="Rename, or change the host">✎</button></span>
          <span class="host"></span>
          <span class="line tagline"><span class="tags"></span><button class="edit-btn edit-tags" type="button" data-focus="edit-tags" title="Edit the tags: labels to filter the list by, e.g. a site, a customer or a service" aria-label="Edit the tags"></button></span>
        </span>
        <span class="beats" aria-hidden="true"></span>
        <span class="figures"><span class="uptime"></span><span class="latency"></span></span>
      </div>
      <div class="detail" hidden>
        <div class="chart"></div>
        <div class="stats"></div>
        <div class="row-feed feed" hidden></div>
        <div class="trace" hidden></div>
        <div class="actions"></div>
      </div>
    </article>
  </template>
</body>
</html>
