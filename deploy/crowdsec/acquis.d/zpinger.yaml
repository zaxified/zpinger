# zpinger's events from the journal (doc/security-log.md). `type: syslog`:
# CrowdSec's syslog parser takes the program name (zpinger) and the message
# from journalctl's line, and the zpinger parser goes on from there.
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=zpinger.service"
labels:
  type: syslog
