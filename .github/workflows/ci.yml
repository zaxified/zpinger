name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      # Ubuntu 24.04 runners restrict unprivileged user namespaces through
      # AppArmor; scripts/netns-run (unit tests, smoke.sh) needs them to run
      # live ICMP sockets as a normal user. Inside the namespace it opens
      # ping_group_range itself.
      - name: Allow unprivileged user namespaces
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi

      # Same entry point as local development: fmt, unit tests, both .deb
      # packages and the smoke test of the packaged binary.
      - name: Test pipeline
        run: sh scripts/test.sh
